<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon"  href="./assets/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <title>Spotify - Web Player: Music for everyone</title>
</head>
<body>
    <div class="main">
        <div class="sidebar">
                <div class="nav">
                    <div class="nav-option">
                        <i class="fas fa-house"></i>
                        <a href="#">Home</a>
                    </div>
                    <div class="nav-option">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <a href="#">Search</a> 
                    </div>
                </div>
                <div class="library">
                    <div class="options">
                        <div class="lib-option">
                            <img src="./assets/library_icon.png">
                            <a href="#">Your Library</a>
                        </div>
                        <div class="icons">
                            <i class="fa-solid fa-plus"></i>
                            <i class="fa-solid fa-arrow-right"></i>

                        </div>
                    </div>
                    <div class="lib-box">
                        <div class="box-p1"> Create your first playlist</div>
                        <div class="box-p2">It's easy ,we'll help you</div>
                        <button class="badge">Create Playlist</button>
                    </div>
                    <div class="lib-box">
                        <div class="box-p1"> Let's find some podcasts to follow</div>
                        <div class="box-p2">We'll keep you updated on new episodes</div>
                        <button class="badge">Browse podcasts</button>
                    </div>
                </div>
        </div>
            
        <div class="mainbar">
            <div class="sticky-nav">
                <div class="sticky-nav-icons">
                <img src="./assets/backward_icon.png">
                <img src="./assets/forward_icon.png">
                </div>
                <div class="sticky-nav-options">
                <button class="badge">Explore Premium</button>
                <button class="dark-badge"> <i class="fa-regular fa-circle-down"></i> Install App </button>
                <i class="fa-solid fa-user"></i>
                </div>
            </div>
            <div class="content">
                <h2>Recently Played </h2>
                <div class="cards-container">
                    <div class="card">
                        <img src="./assets/card1img.jpeg">
                        <p class="card-title">Top 50-Global</p>
                        <p class="card-information">Your daily updates of the most played tracks</p>
                    </div>

                </div>
            </div>


            </div>
        </div>   
        <div class="music-player">music player</div>
    </div>
    

</body>
</html>
</body>
</html>
